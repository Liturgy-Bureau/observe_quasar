<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Observe</title>

  <meta property="og:title" content="Observe">
  <meta property="og:type" content="application">
  <meta property="og:url" content="https://www.obs.liturgy.one">
  <meta property="og:description" content="An IOT, Telemetry and RC Platform">
  <meta property="og:site_name" content="Liturgy" />

  <base href="/"> <!-- IMPORTANT -->

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- for older browsers
  <link rel="icon" href="images/favicon.ico">
  -->

  <!-- preloader style-->
  <style>
   .pbar-container {
     width: 100%;
     height: 100%;
     background-color: grey;
     position: fixed;
     top: 0;
     z-index: 999;
    }
    .pbar {
      background-color: inherit;
      width: 100%;
      height: 3px;
      overflow: hidden;
    }
    .pbar-value {
      width: 100%;
      height: 100%;
      background-color: rgba(153, 0, 0, 0.5);
      animation: indeterminateAnimation 1s infinite linear;
      transform-origin: 0% 50%;
    }

    /* Safari */
    @-webkit-keyframes indeterminateAnimation {
      0% {
      transform:  translateX(0) scaleX(0);
    }
    40% {
      transform:  translateX(0) scaleX(0.4);
    }
    100% {
      transform:  translateX(100%) scaleX(0.5);
    }
    }

    @keyframes indeterminateAnimation {
      0% {
      transform:  translateX(0) scaleX(0);
    }
    40% {
      transform:  translateX(0) scaleX(0.4);
    }
    100% {
      transform:  translateX(100%) scaleX(0.5);
    }
  }
  </style>
  <!-- preloader style end -->

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- CDNs -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">

</head>
<body>
  <app-root>
    <div class="pbar-container">
      <div class="pbar">
        <div class="pbar-value"></div>
      </div>
    </div>
  </app-root>
</body>
</html>
